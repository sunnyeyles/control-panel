name: Preview auth domain

# Sign-in on a preview deployment, which nothing else in this repo covers.
#
# Neon Auth checks `callbackURL` against a trusted-domain allowlist *before* it
# checks the provider, so an origin missing from that list is refused with
# `403 INVALID_CALLBACKURL` and sign-in never starts. The UI cannot paper over
# it: `apps/dashboard/app/auth/sign-in/sign-in-form.tsx` can only name the
# problem, not fix it.
#
# `apps/dashboard/lib/auth/callback-origin.ts` already did the half that code
# can do. It sends preview OAuth back to the stable per-branch alias rather than
# the per-deployment hash host, which cut the allowlist's appetite from one
# entry per *build* to one per *branch*. That is a treadmill slow enough to walk
# and still a treadmill — nobody ran the command, so on 2026-08-10 the list held
# 103 entries of which three were branch aliases, and every open PR's preview
# was refused. This workflow is the other half: it runs the command.
#
# **The alias is read from Vercel, never constructed.** Vercel truncates a long
# branch name to 13 characters and appends six hex digits of a hash it does not
# document — `add-vercel-agent-skills` deploys to
# `control-panel-git-add-vercel-ag-3897e3-…`, not to the name spelled out. A
# reimplementation of that rule would be wrong for exactly the branches whose
# names are long, and wrong *silently*: the domain would be added, the workflow
# would go green, and sign-in would still 403. `meta.branchAlias` on the
# deployment is the value Vercel actually assigned.
#
# Wildcards are not the shortcut they look like. Neon wildcards a whole hostname
# segment (`https://*.example.com`) and Vercel varies the hash *inside* the first
# label, so the only pattern that matches is `https://*.vercel.app` — every
# Vercel site on the internet, trusted as a redirect target.
#
# The ids below are committed rather than held in repository variables, for the
# reason `migrate.yml` gives: the value CI uses should be the value in the diff.
# They identify a project and grant nothing. `NEON_API_KEY` and `VERCEL_TOKEN`
# are the credentials, and they are the only secrets here.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

env:
  NEON_PROJECT_ID: sparkling-paper-60637779
  # Which Neon branch's allowlist to edit. Every Neon branch gets its own auth
  # endpoint, its own users and its own allowlist, and Vercel's Preview
  # environment pins `NEON_AUTH_BASE_URL` to main's — so main's list is the one
  # a preview is actually checked against. Editing the PR's own
  # `preview/<branch>` Neon branch would add the domain to an instance no
  # deployment talks to.
  NEON_AUTH_BRANCH: main
  NEONCTL_VERSION: "2"
  VERCEL_PROJECT_ID: prj_EOljy3LZZWIiMSH4SMeU2yldYcbK
  VERCEL_TEAM_ID: team_UCFvCpfR7ntaHXrZPGNDjGSG

jobs:
  sync:
    # Secrets are absent on a fork's pull request, so this would fail for a
    # reason that has nothing to do with the contribution — and a fork's branch
    # gets no preview deployment to trust in the first place.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: preview-auth-domain-${{ github.event.pull_request.number }}
      # Deliberately not `cancel-in-progress: true`. The `closed` run removes
      # the domain and a `synchronize` run adds it; cancelling either mid-flight
      # would leave the allowlist disagreeing with the PR's state. The job takes
      # seconds, so there is nothing to save by racing them.
      cancel-in-progress: false

    steps:
      # First, because they need nothing else and because of how the
      # alternatives fail. Without `NEON_API_KEY` the CLI exits with "Cannot run
      # interactive auth in CI" — true, and it names neither the secret nor this
      # workflow. Without `VERCEL_TOKEN` the API answers 403 with a JSON body
      # that `jq` turns into a null alias and a confusing "no deployment yet".
      - name: Check the secrets are set
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          if [ -z "${NEON_API_KEY:-}" ]; then
            echo "::error::NEON_API_KEY is not set. This workflow edits the Neon"
            echo "Auth trusted-domain allowlist and cannot authenticate without it."
            missing=1
          fi
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not set. This workflow reads the branch"
            echo "alias Vercel assigned to this PR's deployment. Create a token at"
            echo "vercel.com/account/tokens, scoped to Sunny's projects."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the missing secret(s) under Settings → Secrets and"
            echo "variables → Actions, then re-run this workflow."
            exit 1
          fi

      # Vercel assigns `meta.branchAlias` when the deployment is *created*, not
      # when it goes ready — a QUEUED, BUILDING, ERROR or even CANCELED
      # deployment carries the final value. So this waits only for the webhook
      # that starts the build, which is why a short poll is enough. It reads any
      # deployment on the branch rather than the newest ready one for the same
      # reason: the alias is a property of the branch, identical across builds.
      - name: Resolve the branch alias Vercel assigned
        id: alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          api="https://api.vercel.com/v6/deployments"
          query="projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=1"

          alias=""
          for attempt in $(seq 1 12); do
            # --get with --data-urlencode so a branch name containing `/` or `#`
            # — `fix/oauth-samesite-lax` is a real one here — reaches Vercel as
            # the branch it names rather than as a truncated query string.
            alias="$(
              curl -sS --get "$api" \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                --data "$query" \
                --data-urlencode "meta-githubCommitRef=$HEAD_REF" \
              | jq -r '.deployments[0].meta.branchAlias // empty'
            )"

            if [ -n "$alias" ]; then break; fi

            echo "No deployment for $HEAD_REF yet (attempt $attempt/12); waiting…"
            sleep 15
          done

          if [ -z "$alias" ]; then
            echo "::error::Vercel has no deployment for '$HEAD_REF' after three"
            echo "minutes, so there is no branch alias to trust. If Vercel is not"
            echo "building this branch at all, sign-in on its preview cannot work"
            echo "and this is the first place that shows it."
            exit 1
          fi

          # Neon compares full origins. The API returns a bare host, and a
          # trailing slash is not forgiven — same normalisation, and same
          # reason, as `toOrigin()` in lib/auth/callback-origin.ts.
          echo "origin=https://$alias" >> "$GITHUB_OUTPUT"
          echo "Branch alias: https://$alias"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install neonctl
        run: npm install -g neonctl@${{ env.NEONCTL_VERSION }}

      # Read the list first rather than letting `add` or `delete` decide what an
      # already-correct allowlist means. `synchronize` fires on every push, so
      # the overwhelmingly common case is a domain that is already there, and a
      # non-zero exit for "nothing to do" would paint every PR after its first
      # push red. The same reasoning covers `closed` on a PR whose domain was
      # never added — a merge should not fail over a cleanup with nothing to
      # clean.
      - name: Add or remove the trusted domain
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          ORIGIN: ${{ steps.alias.outputs.origin }}
          CLOSED: ${{ github.event.action == 'closed' }}
        run: |
          set -euo pipefail

          present() {
            neon neon-auth domain list \
              --project-id "$NEON_PROJECT_ID" \
              --branch "$NEON_AUTH_BRANCH" \
              --output json \
            | jq -e --arg d "$ORIGIN" 'any(.[]; .domain == $d)' > /dev/null
          }

          if [ "$CLOSED" = "true" ]; then
            if present; then
              neon neon-auth domain delete "$ORIGIN" \
                --project-id "$NEON_PROJECT_ID" \
                --branch "$NEON_AUTH_BRANCH"
              echo "Removed $ORIGIN — the pull request is closed."
            else
              echo "$ORIGIN is not on the allowlist; nothing to remove."
            fi
          else
            if present; then
              echo "$ORIGIN is already trusted; nothing to do."
            else
              neon neon-auth domain add "$ORIGIN" \
                --project-id "$NEON_PROJECT_ID" \
                --branch "$NEON_AUTH_BRANCH"
              echo "Added $ORIGIN — sign-in will work on this branch's preview."
            fi
          fi
