name: Deploy infra

# Terraform only. Nothing here builds application code: the one workload this
# root used to package and ship went with the job search, and the dashboard
# deploys to Vercel from git on its own.
on:
  push:
    branches: [main]
    # Path-scoped rather than unfiltered: a dashboard-only or UI-only push does
    # not start this workflow at all, which is both stronger and cheaper than
    # starting it and doing nothing.
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yml"
  # Deliberately unfiltered — a manual run should always run.
  workflow_dispatch:

permissions:
  contents: read

# A queued run deploys the same environment as the one in flight, so let the
# newer commit win rather than racing.
concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that can be checked without touching AWS. This is the whole of
  # what a pull request runs: the deploy role trusts `ref:refs/heads/main` only,
  # so a PR cannot assume it — which is the point, not a limitation to work
  # around. Granting pull_request subjects the ability to assume a role that can
  # apply infrastructure would hand it to anyone who can open a PR.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Pinned, and matching the version used locally. `fmt -check` and the
      # test framework both move between minor releases, so a floating CLI can
      # fail a pull request on a tree nobody touched.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform fmt
        run: terraform -chdir=infra/aws fmt -recursive -check -diff

      # -backend=false is what makes this runnable with no credentials and no
      # state bucket. It is the ceiling without AWS access: `plan` calls STS
      # while configuring the provider and fails before reaching a resource.
      - name: Terraform validate
        run: |
          terraform -chdir=infra/aws init -backend=false -input=false
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws/bootstrap init -backend=false -input=false
          terraform -chdir=infra/aws/bootstrap validate

      # The real check, and the reason this job is worth having on a pull
      # request. `validate` catches type errors; these run a mocked plan and
      # assert on what it produces — every object kind actually retained, the
      # dashboard attached to exactly the storage kinds it is meant to hold,
      # an unconfigured dashboard stack actually creating nothing. No
      # credentials, no network, no state. `init` above installs the modules the
      # run blocks target.
      - name: Terraform test
        run: terraform -chdir=infra/aws test

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Mints the GitHub OIDC token AWS exchanges for temporary credentials. No
      # access key is stored anywhere in this repo.
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      # No TF_VAR_* here. Stack configuration lives in the committed
      # infra/aws/terraform.tfvars, which Terraform auto-loads — so the values
      # CI applies are the values in the diff, rather than repository variables
      # that can be changed without a commit and are invisible in review.

    steps:
      # Runs before anything else because it needs nothing else, and because
      # the failures it catches are otherwise slow or silent:
      #
      #   - An empty role ARN makes configure-aws-credentials fail deep into
      #     the run with an error about the assume-role call rather than about
      #     the missing input.
      #   - An empty TF_STATE_BUCKET makes `init` fall back to prompting, which
      #     with -input=false is a failure two steps later.
      #
      # `vars.X` is an empty string whether the variable is unset or set to
      # empty, so these cases are indistinguishable here and both fail.
      - name: Check required repository variables
        run: |
          missing=()
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN TF_STATE_BUCKET; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository variables: ${missing[*]}"
            echo "Apply infra/aws/bootstrap once, then set these from its"
            echo "outputs — see infra/aws/bootstrap/README.md. Confirm with"
            echo "'gh variable list' that they landed as variables: this"
            echo "workflow reads vars.*, so values created as secrets read"
            echo "back empty and stall here."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Partial backend config: the bucket is supplied here rather than written
      # into backend.tf, so nothing in the repository names a bucket that might
      # not exist yet.
      - name: Terraform init
        run: >-
          terraform -chdir=infra/aws init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="region=$AWS_REGION"

      - name: Terraform plan
        run: terraform -chdir=infra/aws plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=infra/aws apply -input=false -auto-approve tfplan
